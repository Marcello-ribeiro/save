<!doctype html>
<html lang="pt-BR" data-theme="dark" data-accent="rosa" data-fx="on" data-size="small">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Guarde backups dos seus saves de PC em ZIP, por jogo." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SaveVault</title>
    <script>
      // Aplica o tema antes da página pintar, para não piscar.
      (function () {
        var p = {};
        try { p = JSON.parse(localStorage.getItem("savevault:prefs") || "{}") || {}; } catch (e) {}
        var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = p.theme === "light" || p.theme === "dark" ? p.theme : (dark ? "dark" : "light");
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-accent", ["rosa", "azul", "lilas", "branco"].indexOf(p.accent) >= 0 ? p.accent : "rosa");
        root.setAttribute("data-fx", p.fx === "off" ? "off" : "on");
        root.setAttribute("data-size", p.size === "medium" ? "medium" : "small");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
