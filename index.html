<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#141518">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true">SV</span><span class="site-name">SaveVault</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="index.html">Início</a>
      <a href="dashboard.html">Painel</a>
      <a href="sobre.html">Sobre</a>
    </nav>
    <a id="auth-action" class="login-btn" href="login.html">Entrar</a>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-copy">
        <h1>Seus saves, guardados por jogo.</h1>
        <p>Envie o arquivo do save, anote em que ponto você parou e baixe de volta quando precisar, em qualquer computador.</p>
        <a id="hero-action" class="primary-btn" href="signup.html">Criar conta</a>
      </div>

      <div class="hero-collage" aria-hidden="true">
        <div class="layer l1"><div class="piece cover-piece"></div></div>
        <div class="layer l4"><div class="piece cover-piece"></div></div>
        <div class="layer l2"><div class="piece cover-piece"></div></div>
        <div class="layer l3">
          <div class="piece ticket">
            <span class="ticket-game" id="ticket-game">Eclipse Runner</span>
            <strong id="ticket-file">slot_01.sav</strong>
            <span class="ticket-note" id="ticket-note">Antes da missão final</span>
            <time id="ticket-date">Último save: 18 nov 2026, 21:40</time>
          </div>
        </div>
        <div class="layer l5"><div class="tape"></div></div>
      </div>
    </section>

    <section aria-labelledby="library-title">
      <div class="library-head">
        <h2 id="library-title">Biblioteca</h2>
        <p id="home-status" class="home-status"></p>
        <div class="search-wrap">
          <input id="search" type="search" placeholder="Buscar jogo" aria-label="Buscar jogo">
        </div>
      </div>
      <div id="games" class="game-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
