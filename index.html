<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaveVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0b0d13">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">SV</a>
    <div class="site-name">SAVEVAULT</div>
    <a id="auth-action" class="login-btn" href="login.html">LOGIN</a>
  </header>

  <nav class="nav">
    <a href="index.html">INÍCIO</a>
    <a href="dashboard.html">MEUS SAVES</a>
    <a href="sobre.html">SOBRE</a>
  </nav>

  <main class="container">
    <section class="hero">
      <div class="hero-copy">
        <span class="eyebrow">SAVEVAULT</span>
        <h1>Seus saves.<br><span>Em um só lugar.</span></h1>
      </div>

      <div class="hero-collage" aria-hidden="true">
        <div class="layer l1"><div class="piece"><i class="sun"></i><i class="hill"></i><i class="hill b"></i></div></div>
        <div class="layer l2"><div class="piece"><i class="grid"></i><i class="dot"></i></div></div>
        <div class="layer l4"><div class="piece"></div></div>
        <div class="layer l3"><div class="piece"><b class="bar"><i></i></b><span class="line"></span><span class="line s"></span><span class="chips"><i></i><i></i><i></i></span></div></div>
        <div class="layer l5"><div class="tape"></div></div>
      </div>
    </section>

    <div class="search-wrap">
      <input id="search" type="search" placeholder="Buscar jogos...">
    </div>

    <p id="home-status" class="muted home-status"></p>
    <section id="games" class="game-grid"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
