<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — SaveVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-page">
  <main class="auth-card">
    <div class="auth-logo">SV</div>
    <h1>Criar conta</h1>
    <p class="muted">Crie sua biblioteca pessoal de saves.</p>

    <form id="signup-form">
      <label>E-mail</label>
      <input type="email" id="email" required>

      <label>Senha</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" class="primary-btn">CRIAR CONTA</button>
    </form>

    <p class="auth-link">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
