<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — SaveVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#141518">
</head>
<body class="center-page">
  <main class="auth-card">
    <a class="auth-logo" href="index.html" aria-label="Voltar ao início">SV</a>
    <h1>Entrar</h1>
    <p class="muted">Acesse a sua biblioteca de saves.</p>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required>
      
      <button type="submit" class="primary-btn">Entrar</button>
      <p id="auth-status" class="form-status" role="status"></p>
    </form>

    <p class="auth-link">Ainda não tem conta? <a href="signup.html">Criar conta</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
