<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — SaveVault</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#141518">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="logo" aria-hidden="true">SV</span><span class="site-name">SaveVault</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="index.html">Início</a>
      <a href="dashboard.html">Painel</a>
      <a href="sobre.html">Sobre</a>
    </nav>
    <button id="logout" class="secondary-btn" type="button">Sair</button>
  </header>

  <main class="dashboard">
    <div class="dashboard-head">
      <div>
        <h1>Meus jogos</h1>
        <p id="dashboard-status"></p>
      </div>
      <button id="new-game" class="primary-btn" type="button">Adicionar jogo</button>
    </div>

    <section id="my-games" class="dashboard-games"></section>
  </main>

  <div id="game-modal" class="modal hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="game-modal-title">
      <button id="close-modal" class="close" type="button" aria-label="Fechar">×</button>
      <h2 id="game-modal-title">Adicionar jogo</h2>
      <p class="muted">Cadastre o jogo com a capa e o primeiro save.</p>

      <form id="game-form">
        <label for="game-name">Nome do jogo</label>
        <input id="game-name" required placeholder="Ex.: God of War">

        <label for="game-cover">Capa</label>
        <input id="game-cover" type="file" accept="image/*" required>

        <label for="game-save">Arquivo do save</label>
        <input id="game-save" type="file" required>

        <label for="game-note">Observação</label>
        <textarea id="game-note" placeholder="Ex.: antes da missão final"></textarea>

        <div class="modal-actions">
          <button type="button" id="cancel-modal" class="secondary-btn">Cancelar</button>
          <button type="submit" id="upload-game" class="primary-btn">Adicionar jogo</button>
        </div>

        <p id="upload-status" class="form-status" role="status"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/fx.js" defer></script>
</body>
</html>
